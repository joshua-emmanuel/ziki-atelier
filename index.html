<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f9f5" />
    <meta
      name="description"
      content="An animated, interactive prototype for clear human and agent decisions."
    />
    <title>Signal Garden · Ziki prototype</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Ziki home">
        <svg class="brand-mark" viewBox="0 0 50 40" role="img" aria-label="Ziki logo">
          <path d="M8 2h37a3 3 0 0 1 2.4 4.8L37 20H3a3 3 0 0 1-2.4-4.8L5.6 3.2A3 3 0 0 1 8 2Z" fill="#3478f6"/>
          <path d="M13 22h24l-9 14a3 3 0 0 1-2.5 1.3H4a3 3 0 0 1-2.4-4.8L9.8 23a4 4 0 0 1 3.2-1Z" fill="#8bc8ff"/>
        </svg>
        <span>ziki</span>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb" id="theme-symbol">☼</span></span>
      </button>
    </header>
    <main>
      <section class="experience" id="experience" data-agent="atlas" aria-label="Agent interaction prototype">
        <div class="agent-picker" role="group" aria-label="Your agents">
          <button class="agent-tab is-active" data-agent="atlas" data-state="asking" type="button" aria-pressed="true"><span class="agent-icon" aria-hidden="true"></span><span class="tab-name">Atlas</span><span class="tab-status">Needs OK</span></button>
          <button class="agent-tab" data-agent="nova" data-state="working" type="button" aria-pressed="false"><span class="agent-icon" aria-hidden="true"></span><span class="tab-name">Nova</span><span class="tab-status">Working</span></button>
          <button class="agent-tab" data-agent="moss" data-state="review" type="button" aria-pressed="false"><span class="agent-icon" aria-hidden="true"></span><span class="tab-name">Moss</span><span class="tab-status">Review</span></button>
        </div>
        <div class="scene" id="scene" data-agent="atlas" data-state="asking">
          <div class="halo" aria-hidden="true"></div>
          <span class="star s1" aria-hidden="true">✦</span
          ><span class="star s2" aria-hidden="true">✳</span
          ><span class="star s3" aria-hidden="true">✦</span>
          <span class="firefly f1" aria-hidden="true"></span>
          <span class="firefly f2" aria-hidden="true"></span>
          <span class="firefly f3" aria-hidden="true"></span>
          <span class="firefly f4" aria-hidden="true"></span>
          <div class="cloud">
            <span class="dot"></span
            ><span id="cloud-text">waiting for you</span>
          </div>
          <button class="bot" id="bot" type="button" aria-label="Tap Atlas for a little surprise">
            <span class="bot-sprite">
            <span class="antenna"></span>
            <span class="body">
              <span class="face">
                <span class="eye left"></span><span class="eye right"></span
                ><span class="cheek left"></span
                ><span class="cheek right"></span><span class="mouth"></span>
              </span>
              <span class="heart">♥</span>
            </span>
            <span class="arm left"></span><span class="arm right"></span
            ><span class="foot left"></span><span class="foot right"></span
            ><span class="spark one">✦</span><span class="spark two">✧</span>
            </span>
          </button>
          <span class="tap-hint" aria-hidden="true">tap me ✦</span>
          <span class="stage-prop" id="stage-prop" aria-hidden="true">✉</span>
          <div class="ground" aria-hidden="true">
            <span class="plant left">✿</span><span class="plant right">✿</span>
          </div>
          <div class="confetti" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
        <div class="content">
          <div class="identity" id="identity">ATLAS · CONTRIBUTOR</div>
          <h1 id="title" aria-live="polite">Needs your OK</h1>
          <p class="task" id="task">Fix login timeout · 30 min</p>
          <div class="progress" id="progress" aria-label="Agent progress">
            <span class="current"></span><span></span><span></span><span></span>
          </div>
          <div class="step-labels">
            <span>ASK</span><span>WORK</span><span>REVIEW</span
            ><span>DONE</span>
          </div>
          <div class="actions">
            <button class="button primary" id="primary" type="button">
              Go ahead</button
            ><button class="button secondary" id="secondary" type="button">
              Change plan
            </button>
          </div>
          <button class="text-action" id="detail" type="button" aria-controls="panel" aria-expanded="false">
            What will you do?
          </button>
          <div class="panel" id="panel" role="region" aria-label="Agent details" hidden></div>
        </div>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
